# configs/train_xvector_ljspeech_augmented.yaml
# Stage-1 Training with LJSpeech + On-the-Fly Data Augmentation
# LJSpeech contains only clean audio, so we use augmentation to create noisy versions

# ----------------------
# Trainer configuration
# ----------------------
trainer:
  accelerator: "auto"
  devices: 1
  max_epochs: 10000
  precision: "16-mixed"
  log_every_n_steps: 100
  check_val_every_n_epoch: 5  # Validate more frequently with augmentation
  gradient_clip_val: 1.0
  deterministic: false
  benchmark: true

# ----------------------
# Global / runtime
# ----------------------
seed: 1234
checkpoint_dir: "logs/ljspeech_stage1_checkpoints"
logging_dir: "logs/ljspeech_stage1"
latents_dir: "stored_latents_ljspeech_stage1"

# ----------------------
# Audio configuration
# ----------------------
audio:
  sample_rate: 22050  # LJSpeech native sample rate

# ----------------------
# Model Configuration
# ----------------------
model:
  # X-Vector settings
  xvector_dim: 512
  conditioning_type: "addition"

  # Optional: Load vanilla CleanUNet2 checkpoint for warm start
  vanilla_checkpoint: null

  # Optional: Local X-Vector model path (if you downloaded it)
  xvector_local_path: null  # e.g., "pretrained_models/spkrec-xvect-voxceleb"

  # CleanUNet parameters
  cleanunet_params:
    channels_input: 1
    channels_output: 1
    channels_H: 64
    max_H: 768
    encoder_n_layers: 8
    kernel_size: 4
    stride: 2
    tsfm_n_layers: 5
    tsfm_n_head: 8
    tsfm_d_model: 512
    tsfm_d_inner: 2048

  # CleanSpecNet parameters
  cleanspecnet_params:
    input_channels: 513
    num_conv_layers: 5
    kernel_size: 4
    stride: 1
    conv_hidden_dim: 64
    hidden_dim: 512
    num_attention_layers: 5
    num_heads: 8
    dropout: 0.1

# ----------------------
# Loss Configuration
# ----------------------
losses:
  weight_waveform: 10.0
  weight_spec: 1.0
  weight_phase: 1.0

  # STFT loss configuration
  stft_config:
    fft_sizes: [512, 1024, 2048]
    hop_sizes: [128, 256, 512]
    win_lengths: [512, 1024, 2048]

# ----------------------
# Optimizer Configuration
# ----------------------
optimizer:
  lr: 1e-4
  betas: [0.9, 0.999]

# ----------------------
# Data configuration
# ----------------------
data:
  # LJSpeech dataset path
  data_dir: "/path/to/LJSpeech-1.1"
  train_list_path: "filelists/ljspeech_train.txt"

  # ============================================================
  # CONFIGURAÇÃO DE VALIDAÇÃO - Escolha UMA das opções abaixo:
  # ============================================================

  # OPÇÃO 1: Usar arquivo/lista separada para validação
  val_list_path: "filelists/ljspeech_val.txt"

  # OPÇÃO 2: Split automático (porcentagem do conjunto de treino)
  # Comente 'val_list_path' acima e descomente a linha abaixo:
  # val_split: 0.1  # 10% do treino para validação (0.15 = 15%, 0.2 = 20%, etc.)

  batch_size: 16  # Smaller batch for augmented data
  num_workers: 8
  persistent_workers: true
  segment_size: 24576  # ~1.1 seconds at 22050 Hz
  sampling_rate: 22050  # IMPORTANTE: Deve corresponder ao audio.sample_rate

  # ============================================================
  # Data Augmentation (On-the-Fly) com Busca Recursiva
  # ============================================================
  # These augmentations will be applied to clean audio to create synthetic noisy versions
  # IMPORTANTE: Arquivos de ruído são automaticamente reamostrados para 22050 Hz
  augmentations:
    # 1. Add Colored Noise (pink, brown, white)
    - name: "AddColoredNoise"
      params:
        min_snr_in_db: 5.0
        max_snr_in_db: 20.0
        min_f_decay: -2.0  # Pink noise
        max_f_decay: 2.0   # Brown noise
        p: 0.7  # 70% probability

    # 2. Add Background Noise (environmental sounds)
    # SUPORTA BUSCA RECURSIVA! Especifique apenas o diretório:
    - name: "AddBackgroundNoise"
      params:
        # Opção 1: Um único diretório (busca .wav/.flac/.mp3/.ogg recursivamente)
        background_paths: "/path/to/background_noise_files"  # Busca recursiva automática!

        # Opção 2: Lista de diretórios/arquivos
        # background_paths:
        #   - "/path/to/noise/ESC-50"
        #   - "/path/to/noise/UrbanSound"
        #   - "/path/to/specific_file.wav"

        min_snr_in_db: 3.0
        max_snr_in_db: 15.0
        p: 0.5  # 50% probability

    # 3. Random Gain (volume variation)
    - name: "Gain"
      params:
        min_gain_in_db: -12.0
        max_gain_in_db: 6.0
        p: 0.5

    # 4. Low-Pass Filter (simulate bandwidth limitation)
    - name: "LowPassFilter"
      params:
        min_cutoff_freq: 2000.0
        max_cutoff_freq: 8000.0
        p: 0.3

    # 5. High-Pass Filter (simulate bass reduction)
    - name: "HighPassFilter"
      params:
        min_cutoff_freq: 100.0
        max_cutoff_freq: 400.0
        p: 0.3

# ----------------------
# Callbacks
# ----------------------
callbacks:
  best_checkpoint:
    _target_: "pytorch_lightning.callbacks.ModelCheckpoint"
    monitor: "val/weighted_score"
    dirpath: "logs/ljspeech_stage1_checkpoints"
    filename: "ljspeech-stage1-best-{epoch:02d}-{val/weighted_score:.4f}"
    save_top_k: 1
    mode: "max"

  periodic_checkpoint:
    _target_: "pytorch_lightning.callbacks.ModelCheckpoint"
    dirpath: "logs/ljspeech_stage1_checkpoints"
    filename: "ljspeech-stage1-epoch-{epoch:04d}"
    every_n_epochs: 10
    save_top_k: 3
    save_last: true
    monitor: "val_loss"
    mode: "min"

# ----------------------
# Logger
# ----------------------
logger:
  choice: "tensorboard"

  tensorboard:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: "logs/ljspeech_stage1"
    name: "xvector_stage1_ljspeech_augmented"
    default_hp_metric: false

  wandb:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: "CleanUNet2_XVector_LJSpeech"
    name: "stage1_ljspeech_augmented"
    save_dir: "logs/ljspeech_stage1"
    offline: false
    log_model: true

# ----------------------
# Resume / checkpoints
# ----------------------
