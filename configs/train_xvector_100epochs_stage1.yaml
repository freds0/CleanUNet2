# configs/train_xvector_100epochs_stage1.yaml
# Stage-1 Training Configuration: 100 Epochs
# X-Vectors are extracted from clean audio and fused into latent space

# ----------------------
# Trainer configuration
# ----------------------
trainer:
  accelerator: auto
  devices: 1
  max_epochs: 100  # 100 épocas
  precision: 16-mixed
  log_every_n_steps: 50
  check_val_every_n_epoch: 1  # Validar a cada época
  gradient_clip_val: 5.0
  deterministic: false
  benchmark: true

# ----------------------
# Global / runtime
# ----------------------
seed: 1234
checkpoint_dir: experiments/exp_xvector_100epochs_stage1/checkpoints
logging_dir: experiments/exp_xvector_100epochs_stage1
latents_dir: experiments/exp_xvector_100epochs_stage1/stored_latents_stage1

# ----------------------
# Audio configuration
# ----------------------
audio:
  sample_rate: 16000

# ----------------------
# Model Configuration
# ----------------------
model:
  # X-Vector settings
  xvector_dim: 512
  conditioning_type: film

  # X-Vector Cache
  xvector_cache_enabled: true
  xvector_cache_dir: experiments/exp_xvector_100epochs_stage1/xvector_cache_stage1

  # Optional: Load vanilla CleanUNet2 checkpoint for warm start
  vanilla_checkpoint: null

  # CleanUNet parameters
  cleanunet_params:
    channels_input: 1
    channels_output: 1
    channels_H: 64
    max_H: 768
    encoder_n_layers: 8
    kernel_size: 4
    stride: 2
    tsfm_n_layers: 5
    tsfm_n_head: 8
    tsfm_d_model: 512
    tsfm_d_inner: 2048

  # CleanSpecNet parameters
  cleanspecnet_params:
    input_channels: 513
    num_conv_layers: 5
    kernel_size: 4
    stride: 1
    conv_hidden_dim: 64
    hidden_dim: 512
    num_attention_layers: 5
    num_heads: 8
    dropout: 0.1

# ----------------------
# Loss Configuration
# ----------------------
losses:
  # Loss weights
  weight_waveform: 10.0
  weight_spec: 5.0
  weight_phase: 5.0

  # Loss type
  ell_p: 1  # L1 loss
  ell_p_lambda: 1.0

  # STFT loss parameters
  stft_lambda: 0.5
  sc_lambda: 0.8
  mag_lambda: 0.2

  # STFT loss configuration
  stft_config:
    fft_sizes: [512, 1024, 2048]
    hop_sizes: [50, 120, 240]
    win_lengths: [240, 600, 1200]

# ----------------------
# Optimizer Configuration
# ----------------------
optimizer:
  lr: 5.0e-05
  betas: [0.9, 0.999]

# ----------------------
# Learning Rate Scheduler
# ----------------------
lr_scheduler:
  type: reduce_on_plateau
  reduce_on_plateau:
    mode: min
    factor: 0.5
    patience: 10
    min_lr: 1.0e-07
    monitor: val_loss

# ----------------------
# Data configuration
# ----------------------
data:
  data_dir: /home/ubuntu/fred-experiments/DATASETS/VoiceBank-DEMAND-16k/
  train_list_path: filelists/train.csv
  val_list_path: filelists/test.csv
  batch_size: 4
  num_workers: 8
  persistent_workers: true
  segment_size: 32768
  sampling_rate: 16000
  use_xvector_cache: true

# ----------------------
# Callbacks
# ----------------------
callbacks:
  # Save best checkpoint based on validation loss
  best_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_loss
    dirpath: experiments/exp_xvector_100epochs_stage1/checkpoints
    filename: stage1-best-{epoch:03d}-{val_loss:.4f}
    save_top_k: 5  # Salvar top 5 melhores
    mode: min
    save_last: true

  # Early stopping
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_loss
    patience: 20  # Parar se não melhorar por 20 épocas
    mode: min
    min_delta: 0.001

# ----------------------
# Logger
# ----------------------
logger:
  choice: both

  tensorboard:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: experiments/exp_xvector_100epochs_stage1
    name: tb_logs
    default_hp_metric: false

  wandb:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: CleanUNet2_XVector_100epochs
    name: stage1_100epochs
    save_dir: experiments/exp_xvector_100epochs_stage1
    offline: false
    log_model: true

# ----------------------
# Resume / checkpoints
# ----------------------
