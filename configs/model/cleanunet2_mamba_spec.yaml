# All-data spectral branch, Mamba version (IMPROVEMENT_PLAN.md, 15.2): the W5 CleanSpecNet (linear front-end, mask
# output, non-causal 5-layer bidirectional Mamba backbone). Trained alone (loss.mode spec) and used through the
# training-free magnitude blend (evaluate.py --blend_spec).
base: cleanunet_mamba_bidir_e8.yaml
use_spec_branch: true
conditioning_type: film
conditioning_zero_init: true
bottleneck_fusion: false
spectrogram: {n_fft: 1024, hop_length: 256, win_length: 1024, alignment: center, compression: log1p}
cleanspecnet_params:
  causal: false
  output_mode: mask
  frontend: linear
  backbone: {type: mamba, n_layers: 5, d_state: 64, d_conv: 4, expand: 2, bidirectional: true, backend: auto}
