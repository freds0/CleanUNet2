# E0 - corrected CleanUNet2 baseline: Transformer bottleneck + Transformer CleanSpecNet (58.6M params).
# Same architecture as the original repository, with the single in-model STFT and aligned upsampling.
conditioning_type: film
conditioning_zero_init: false
use_spec_branch: true
spectrogram: {n_fft: 1024, hop_length: 256, win_length: 1024, alignment: center, compression: log1p}
cleanunet_params:
  channels_H: 64
  max_H: 768
  encoder_n_layers: 8
  kernel_size: 4
  stride: 2
  bottleneck: {type: transformer, n_layers: 5, n_head: 8, d_model: 512, d_inner: 2048, causal: true}
cleanspecnet_params:
  causal: true
  backbone: {type: transformer, n_layers: 5, n_head: 8}
