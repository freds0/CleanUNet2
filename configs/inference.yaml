# -----------------------------------------------------------
# Inference configuration for CleanUNet2
# -----------------------------------------------------------
inference:
  input_dir: "/home/fred/DATASETS/VoiceBank-DEMAND-16k/test/noisy/"
  input_pattern: "*.flac"            # e.g. "*.wav" or "**/*.wav"
  output_dir: "denoised_voicebank"
  # Lightning / CleanUNet2 checkpoint (keys "model.*"). Leave empty to use only cleanumamba_checkpoint.
  checkpoint_path: ""
  # Optional: official CleanUMamba .pkl for the waveform branch (paths are relative to the working directory)
  cleanumamba_checkpoint: "../cleanumamba/checkpoints/models/CleanUMamba-3N-E8-full.pkl"
  force_cpu: false                   # the CPU path uses the pure-PyTorch Mamba (backend: auto)
  overwrite: false
  use_amp: false                     # bf16 autocast on GPU
  max_chunk_seconds: 60              # longer files are processed in cross-faded chunks
  streaming: false                   # frame-by-frame streaming (waveform-only Mamba models)

model:
  # Must match the architecture used for training (path relative to this file, or a dict)
  architecture: model/cleanunet_mamba_e8.yaml

audio:
  target_sample_rate: 16000

output:
  format: "wav"                      # wav | flac

runtime:
  save_report: true
  report_path: "inference_report.json"
