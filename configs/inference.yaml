# ============================================================================
# CleanUNet2 BASELINE — inference configuration (no SSL / no speaker embeddings).
# Consumed by inference.py. The `model` section is passed to CleanUNetLightningModule;
# only `conditioning_type` matters and MUST match the value used at training time.
# ============================================================================

inference:
  checkpoint_path: "./experiments/checkpoints/last.ckpt"
  input_dir: "/home/fred/Projetos/DATASETS/VoiceBank-DEMAND-16k/test/noisy"
  input_pattern: "*.wav"
  output_dir: "./denoised_voicebank/"
  force_cpu: false
  use_amp: true
  overwrite: false

model:
  conditioning_type: addition   # must match training (configs/config.yaml)

audio:
  target_sample_rate: 16000
  normalize: true

output:
  format: "wav"
  undo_normalize: true

runtime:
  device: "auto"
  verbose: true
  save_metrics_report: false
  metrics_report_path: "inference_metrics.json"
