# ============================================================================
# CleanUNet2 Inference Configuration (WavLM-Only)
# ============================================================================
#
# Usage:
#   python inference.py --config configs/inference.yaml
#
# ============================================================================

# Path to trained checkpoint
checkpoint_path: "experiments/stage1_baseline/checkpoints/best-epoch-XX-val_loss-Y.YYY.ckpt"

# Input/output directories
input_output:
  input_dir: "test_samples/noisy/"
  output_dir: "denoised_output/"

# Audio processing settings
audio_processing:
  sampling_rate: 16000
  n_fft: 1024
  hop_length: 256
  n_mels: 64

# WavLM configuration (must match training config)
wavlm_config:
  model_name: "microsoft/wavlm-large"
  embedding_dim: 768
  hidden_states_layer: 24
  normalize_embeddings: true

# Inference settings
device: "auto"                              # "auto", "cuda", or "cpu"
batch_size: 16
compute_metrics: false                      # Set to true if reference clean audio available
