# ============================================================================
# SSL BACKBONE (standardized documentation -- see CONFIG_STANDARDIZATION_REPORT.md)
# ssl_model_name: speechbrain/spkrec-xvect-voxceleb
# ssl_model_size: tdnn-xvect
# ssl_hidden_size: 512
# ssl_num_layers: 5
# ssl_embedding_strategy: utterance_level_speaker_embedding
# selected_layers: []  # not an SSL layer model
# ============================================================================
# ============================================================================
# CleanUNet2 Inference Configuration (Wav2Vec2 ONLY)
# ============================================================================

inference:
  checkpoint_path: "/media/fred/FRED5TB/CleanUNet2-SSL-Experiments/checkpoints_cleanunet2-xvectors/stage2-best-epoch=284-val_loss=3.5667.ckpt"
  input_dir: "/home/fred/Projetos/DATASETS/VoiceBank-DEMAND-16k/test/noisy"
  input_pattern: "*.wav"
  output_dir: "./denoised_voicebank/"
  force_cpu: false
  use_amp: true

model:
  input_channels: 1
  channels: 64
  num_layers: 4
  kernel_size: 3
  skip_channels: 128
  use_wav2vec: true
  wav2vec_model: "facebook/wav2vec2-xls-r-2b"
  wav2vec_layer: 24
  wav2vec_dim: 1024

audio:
  target_sample_rate: 16000
  normalize: true

output:
  format: "wav"
  overwrite: false

runtime:
  device: "auto"
  verbose: true
  save_metrics_report: false
  metrics_report_path: "inference_metrics.json"


# ────────────────────────────────────────────────────────────────────────────
# Notes
# ────────────────────────────────────────────────────────────────────────────
#
# 1. Checkpoint Selection:
#    - Use the best Stage 2 checkpoint for final inference
#    - Use Stage 1 checkpoint if Stage 2 didn't improve results
#
# 2. Embedding Extraction:
#    - If use_preextracted: true, embeddings must be cached in 'cache_dir'
#    - Pre-extract embeddings with: python scripts/extract_embeddings.py
#    - For on-the-fly extraction (slower), set use_preextracted: false
#
# 3. Device Selection:
#    - "auto": automatically select GPU if available, otherwise CPU
#    - "cuda": use GPU (fails if not available)
#    - "cpu": use CPU only
#
# 4. Output Options:
#    - Save denoised audio to 'output_dir'
#    - Optionally generate metrics report for evaluation
