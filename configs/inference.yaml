# ============================================================================
# CleanUNet2 Inference Configuration (Wav2Vec2 ONLY)
# ============================================================================
# Configuration for running inference on pre-trained models.
#
# Usage:
#   python scripts/inference.py --config configs/inference.yaml
#
# Before running inference:
# 1. Set 'checkpoint_path' to your trained model checkpoint
# 2. Set 'input_output.input_dir' to directory containing .wav files
# 3. Ensure Wav2Vec2 embeddings are pre-extracted (if using preextracted mode)
# ============================================================================

# ────────────────────────────────────────────────────────────────────────────
# Checkpoint Configuration
# ────────────────────────────────────────────────────────────────────────────
checkpoint_path: "experiments/stage2_wav2vec2/checkpoints/best.ckpt"
# TODO: Set this to your trained checkpoint path before running inference


# ────────────────────────────────────────────────────────────────────────────
# Audio Processing Configuration
# ────────────────────────────────────────────────────────────────────────────
audio:
  sample_rate: 16000
  normalize: true               # Peak-normalize input audio


# ────────────────────────────────────────────────────────────────────────────
# Input/Output Configuration
# ────────────────────────────────────────────────────────────────────────────
input_output:
  input_dir: "./test_audio/"    # Directory containing .wav files to denoise
  input_pattern: "*.wav"        # Pattern to match audio files
  output_dir: "./denoised_output/"  # Directory to save denoised audio
  format: "wav"                 # Output audio format
  overwrite: false              # Don't overwrite existing output files


# ────────────────────────────────────────────────────────────────────────────
# Wav2Vec2 Embeddings Configuration
# ────────────────────────────────────────────────────────────────────────────
embeddings:
  model_name: "facebook/wav2vec2-xls-r-2b"
  layer: 24
  input_dim: 1024
  cache_dir: "cached_embeddings/wav2vec2"
  use_preextracted: true        # Load pre-extracted embeddings from cache


# ────────────────────────────────────────────────────────────────────────────
# Runtime Configuration
# ────────────────────────────────────────────────────────────────────────────
runtime:
  device: "auto"                # "auto", "cuda", or "cpu"
  force_cpu: false              # Force CPU even if CUDA available
  use_amp: true                 # Automatic Mixed Precision for faster inference
  verbose: true                 # Print detailed logs
  save_metrics_report: false    # Save metrics (PESQ, STOI if ground truth available)
  metrics_report_path: "inference_metrics.json"


# ────────────────────────────────────────────────────────────────────────────
# Notes
# ────────────────────────────────────────────────────────────────────────────
#
# 1. Checkpoint Selection:
#    - Use the best Stage 2 checkpoint for final inference
#    - Use Stage 1 checkpoint if Stage 2 didn't improve results
#
# 2. Embedding Extraction:
#    - If use_preextracted: true, embeddings must be cached in 'cache_dir'
#    - Pre-extract embeddings with: python scripts/extract_embeddings.py
#    - For on-the-fly extraction (slower), set use_preextracted: false
#
# 3. Device Selection:
#    - "auto": automatically select GPU if available, otherwise CPU
#    - "cuda": use GPU (fails if not available)
#    - "cpu": use CPU only
#
# 4. Output Options:
#    - Save denoised audio to 'output_dir'
#    - Optionally generate metrics report for evaluation
