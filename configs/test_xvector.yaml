# Quick test config for X-Vector model (few steps)
trainer:
  accelerator: auto
  devices: 1
  max_epochs: 1
  precision: 16-mixed
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  gradient_clip_val: 5.0
  deterministic: false
  benchmark: true
  limit_train_batches: 5
  limit_val_batches: 2

seed: 1234
checkpoint_dir: /tmp/test_xvector/checkpoints
logging_dir: /tmp/test_xvector
latents_dir: /tmp/test_xvector/latents

audio:
  sample_rate: 16000

model:
  speaker_model: xvector
  conditioning_type: film
  vanilla_checkpoint: null

  cleanunet_params:
    channels_input: 1
    channels_output: 1
    channels_H: 64
    max_H: 768
    encoder_n_layers: 8
    kernel_size: 4
    stride: 2
    tsfm_n_layers: 5
    tsfm_n_head: 8
    tsfm_d_model: 512
    tsfm_d_inner: 2048

  cleanspecnet_params:
    input_channels: 513
    num_conv_layers: 5
    kernel_size: 4
    stride: 1
    conv_hidden_dim: 64
    hidden_dim: 512
    num_attention_layers: 5
    num_heads: 8
    dropout: 0.1

losses:
  weight_waveform: 10.0
  weight_spec: 5.0
  weight_phase: 5.0
  ell_p: 1
  ell_p_lambda: 1.0
  stft_lambda: 0.5
  sc_lambda: 0.8
  mag_lambda: 0.2
  stft_config:
    fft_sizes: [512, 1024, 2048]
    hop_sizes: [50, 120, 240]
    win_lengths: [240, 600, 1200]

optimizer:
  lr: 5.0e-05
  betas: [0.9, 0.999]

data:
  data_dir: /home/fred/Projetos/DATASETS/VoiceBank-DEMAND-16k/
  train_list_path: filelists/train.csv
  val_list_path: filelists/test.csv
  batch_size: 2
  num_workers: 4
  persistent_workers: false
  segment_size: 32768
  sampling_rate: 16000

callbacks: {}
