# configs/train_with_auto_split.yaml
# Exemplo de configuração usando SPLIT AUTOMÁTICO para validação
# Útil quando você tem apenas um arquivo de treino e quer dividir automaticamente

# ----------------------
# Trainer configuration
# ----------------------
trainer:
  accelerator: "auto"
  devices: 1
  max_epochs: 10000
  precision: "16-mixed"
  log_every_n_steps: 100
  check_val_every_n_epoch: 10
  gradient_clip_val: 1.0
  deterministic: false
  benchmark: true

# ----------------------
# Global / runtime
# ----------------------
seed: 1234
checkpoint_dir: "logs/checkpoints"
logging_dir: "logs"

# ----------------------
# Model & optimizer hyperparameters
# ----------------------
model:
  lr: 1e-4
  sample_rate: 16000
  conditioning_type: "film"

  cleanunet_checkpoint: "checkpoints/cleanunet/last.ckpt"
  cleanspecnet_checkpoint: "checkpoints/cleanspecnet/last.ckpt"

  train_cleanunet: true
  train_cleanspecnet: true

  loss_config:
    ell_p: 1
    ell_p_lambda: 1.0
    stft_lambda: 1.0
    sc_lambda: 0.5
    mag_lambda: 0.5
    stft_config:
      fft_sizes: [512, 1024, 2048]
      hop_sizes: [50, 120, 240]
      win_lengths: [240, 600, 1200]

# ----------------------
# Data configuration
# ----------------------
data:
  data_dir: "/home/fred/Projetos/DATASETS/VoiceBank-DEMAND-16k/"
  train_list_path: "filelists/train.csv"

  # ============================================================
  # SPLIT AUTOMÁTICO - 10% dos dados de treino para validação
  # ============================================================
  # NÃO especificamos val_list_path, usamos val_split:
  val_split: 0.1  # 10% para validação, 90% para treino
  # Outras opções: 0.15 (15%), 0.2 (20%), etc.

  batch_size: 30
  num_workers: 8
  persistent_workers: true
  segment_size: 24576

  # Augmentation desabilitado por padrão
  augmentation:
    enabled: false
    mode: "two_folders"

# ----------------------
# Callbacks
# ----------------------
callbacks:
  best_checkpoint:
    _target_: "pytorch_lightning.callbacks.ModelCheckpoint"
    monitor: "val/weighted_score"
    dirpath: "logs/checkpoints"
    filename: "best-model-{epoch:02d}-{val\/weighted_score:.4f}"
    save_top_k: 1
    mode: "max"

  periodic_checkpoint:
    _target_: "pytorch_lightning.callbacks.ModelCheckpoint"
    dirpath: "logs/checkpoints"
    filename: "epoch-{epoch:04d}"
    every_n_epochs: 10
    save_top_k: 3
    save_last: true
    monitor: "val_loss"
    mode: "min"

# ----------------------
# Logger
# ----------------------
logger:
  choice: "tensorboard"

  tensorboard:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: "logs"
    name: "cleanunet2_autosplit"
    default_hp_metric: false

  wandb:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: "CleanUNet2_Project"
    name: "cleanunet2_with_autosplit"
    save_dir: "logs"
    offline: false
    log_model: true
