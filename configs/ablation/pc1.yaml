# Short protocol, step 1 (IMPROVEMENT_PLAN.md 3.2): fusion warm-up with both branches frozen.
# The queue sets model.architecture, model.init.cleanspecnet_checkpoint and the output directories.
base: ../base.yaml
trainer:
  max_steps: 1000
  max_epochs: -1
  limit_val_batches: 0           # the final checkpoint is evaluated with evaluate.py
  num_sanity_val_steps: 0
model:
  architecture: ../model/fusion/P3_bott_pre.yaml
  init:
    cleanunet_checkpoint: logs/stageA_cleanunet_mamba/checkpoints/best-epoch016-pesq2.755.ckpt
    cleanspecnet_checkpoint: logs/abl/stageB_plus/checkpoints/last.ckpt
  train_cleanunet: false
  train_cleanspecnet: false
loss: {mode: waveform}
optim: {lr: 1.0e-3}
callbacks:
  best_checkpoint: {monitor: null, save_top_k: 1, filename: "step{step}", dirpath: logs/abl/pc1/checkpoints}
logger:
  tensorboard: {name: abl/pc1}
