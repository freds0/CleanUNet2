# ============================================================================
# CleanUNet2 Training Configuration (Wav2Vec2 ONLY - Unified)
# ============================================================================
# Unified configuration supporting both Stage 1 and Stage 2 training.
# Use 'pipeline.stage: 1' or 'pipeline.stage: 2' to switch between stages.
#
# Usage:
#   # Stage 1 without augmentation
#   python scripts/train.py --config configs/train.yaml --stage 1
#
#   # Stage 1 with augmentation (enable augmentation below)
#   python scripts/train.py --config configs/train.yaml --stage 1
#
#   # Stage 2 (requires Stage 1 checkpoint)
#   python scripts/train.py --config configs/train.yaml --stage 2
#
#   # Quick test (1 epoch, 30 samples)
#   python scripts/train.py --config configs/train.yaml --stage 1 --quick-test
# ============================================================================

# ────────────────────────────────────────────────────────────────────────────
# Pipeline Configuration
# ────────────────────────────────────────────────────────────────────────────
pipeline:
  stage: 1
  name: "wav2vec2_stage1_baseline"
  description: "Stage 1 training with Wav2Vec2 embeddings (baseline, no augmentation)"


# ────────────────────────────────────────────────────────────────────────────
# Trainer Configuration (PyTorch Lightning)
# ────────────────────────────────────────────────────────────────────────────
trainer:
  accelerator: auto
  devices: 1
  max_epochs: 300
  precision: 16-mixed          # Automatic Mixed Precision for faster training
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  gradient_clip_val: 5.0
  deterministic: false
  benchmark: true              # Enable cuDNN benchmarking


# ────────────────────────────────────────────────────────────────────────────
# Model Configuration (Wav2Vec2 ONLY - No XVector support)
# ────────────────────────────────────────────────────────────────────────────
model:
  name: "cleanunet2_wav2vec2"
  conditioning_type: "film"    # FiLM conditioning for spec↔waveform fusion

  # Freeze flags (all submodules trainable by default)
  freeze_cleanunet: false
  freeze_cleanspecnet: false

  # Wav2Vec2 Embeddings (1024-D from facebook/wav2vec2-xls-r-2b, layer 24)
  embeddings:
    model_name: "facebook/wav2vec2-xls-r-2b"
    layer: 24                   # Extract from middle layer
    input_dim: 1024             # Fixed: XLS-R 2B output dimension
    cache_dir: "cached_embeddings/wav2vec2"
    use_preextracted: true      # Load pre-extracted embeddings from cache

  # CleanUNet Architecture (Waveform Domain)
  cleanunet:
    channels_input: 1
    channels_output: 1
    channels_H: 64
    max_H: 768
    encoder_n_layers: 8
    kernel_size: 4
    stride: 2
    tsfm_n_layers: 5
    tsfm_n_head: 8
    tsfm_d_model: 512
    tsfm_d_inner: 2048

  # CleanSpecNet Architecture (Spectrogram Domain)
  cleanspecnet:
    input_channels: 513         # 1 + FFT_SIZE/2
    num_conv_layers: 5
    kernel_size: 4
    stride: 1
    conv_hidden_dim: 64
    hidden_dim: 512
    num_attention_layers: 5
    num_heads: 8
    dropout: 0.1

  # Optional: Load vanilla checkpoint for warm start
  vanilla_checkpoint: null


# ────────────────────────────────────────────────────────────────────────────
# Loss Configuration
# ────────────────────────────────────────────────────────────────────────────
losses:
  # Loss weights (balanced for Stage 1)
  weight_waveform: 10.0         # Reconstruction loss weight
  weight_spec: 5.0              # Spectrogram loss weight
  weight_phase: 5.0             # Phase consistency weight

  # Waveform loss parameters
  ell_p: 1                       # 1 for L1 (default), 2 for L2
  ell_p_lambda: 1.0

  # STFT loss parameters
  stft_lambda: 0.5              # STFT reconstruction weight
  sc_lambda: 0.8                # Spectral convergence weight
  mag_lambda: 0.2               # Magnitude weight

  # Multi-resolution STFT loss
  stft_config:
    fft_sizes: [512, 1024, 2048]
    hop_sizes: [50, 120, 240]
    win_lengths: [240, 600, 1200]

  # Stage 2 only: Latent replication weight (gamma parameter)
  gamma_latent: 0.05


# ────────────────────────────────────────────────────────────────────────────
# Optimizer Configuration
# ────────────────────────────────────────────────────────────────────────────
optimizer:
  name: "adam"
  lr: 5.0e-05                   # Learning rate
  betas: [0.9, 0.999]          # Adam beta1, beta2
  weight_decay: 0.0             # L2 regularization


# ────────────────────────────────────────────────────────────────────────────
# Data Configuration
# ────────────────────────────────────────────────────────────────────────────
data:
  # Dataset paths (relative to data_dir or absolute)
  data_dir: "/home/ubuntu/fred-experiments/DATASETS/VoiceBank-DEMAND-16k/"
  train_list_path: "filelists/train.csv"
  val_list_path: "filelists/test.csv"

  # Batch and worker settings
  batch_size: 16
  num_workers: 4
  persistent_workers: true

  # Audio processing
  sample_rate: 16000
  segment_size: 32000           # ~2 seconds at 16kHz (adjust as needed)

  # Wav2Vec2 embedding caching
  use_preextracted_embeddings: true

  # Data augmentation (STAGE 1 SPECIFIC)
  # ────────────────────────────────────────────────────────────────────────
  # To enable augmentation, set 'enabled: true' and uncomment techniques below
  # ────────────────────────────────────────────────────────────────────────
  augmentation:
    enabled: false              # Set to true to enable augmentation
    techniques: []              # Techniques will be applied if enabled
    probability: 0.5

  # When augmentation.enabled = true, uncomment this section:
  # augmentation:
  #   enabled: true
  #   techniques:
  #     - name: "AddColoredNoise"
  #       params:
  #         min_snr_in_db: 5.0
  #         max_snr_in_db: 20.0
  #         min_f_decay: -2.0
  #         max_f_decay: 2.0
  #         p: 0.6
  #     - name: "Gain"
  #       params:
  #         min_gain_in_db: -12.0
  #         max_gain_in_db: 6.0
  #         p: 0.5
  #     - name: "LowPassFilter"
  #       params:
  #         min_cutoff_freq: 3000.0
  #         max_cutoff_freq: 8000.0
  #         p: 0.3
  #     - name: "HighPassFilter"
  #       params:
  #         min_cutoff_freq: 100.0
  #         max_cutoff_freq: 300.0
  #         p: 0.3
  #   probability: 0.5


# ────────────────────────────────────────────────────────────────────────────
# Checkpoint Configuration
# ────────────────────────────────────────────────────────────────────────────
checkpoint:
  save_dir: "experiments/stage1_wav2vec2_baseline/checkpoints"
  save_top_k: 3
  monitor_metric: "val_loss"
  mode: "min"
  every_n_epochs: 10
  resume_from_checkpoint: null  # Set to checkpoint path to resume


# ────────────────────────────────────────────────────────────────────────────
# Logging Configuration
# ────────────────────────────────────────────────────────────────────────────
logging:
  loggers: ["tensorboard"]      # Options: ["tensorboard"], ["wandb"], or ["tensorboard", "wandb"]

  tensorboard:
    save_dir: "experiments/stage1_wav2vec2_baseline"
    name: "tb_logs"
    default_hp_metric: false

  wandb:
    project: "CleanUNet2_Wav2Vec2"
    name: "stage1_baseline"
    offline: false
    log_model: false


# ────────────────────────────────────────────────────────────────────────────
# Callbacks Configuration
# ────────────────────────────────────────────────────────────────────────────
callbacks:
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 20
    min_delta: 0.001
    mode: "min"


# ────────────────────────────────────────────────────────────────────────────
# Debug Configuration
# ────────────────────────────────────────────────────────────────────────────
debug:
  quick_test: false             # Set to true for quick sanity check
  quick_test_samples: 30        # Number of samples for quick test
  quick_test_epochs: 1          # Number of epochs for quick test
  seed: 1234


# ────────────────────────────────────────────────────────────────────────────
# Stage 2 Configuration (if pipeline.stage = 2)
# ────────────────────────────────────────────────────────────────────────────
# Uncomment and set the Stage 1 checkpoint path when training Stage 2
# stage1_checkpoint: "experiments/stage1_wav2vec2_baseline/checkpoints/best-epoch-XX-val_loss-Y.YYY.ckpt"


# ────────────────────────────────────────────────────────────────────────────
# Configuration Presets (for quick reference)
# ────────────────────────────────────────────────────────────────────────────
#
# PRESET 1: Quick Test (1 epoch, 30 samples)
#   python scripts/train.py --config configs/train.yaml --quick-test
#
# PRESET 2: Stage 1 Baseline (no augmentation)
#   - Already configured above
#   - python scripts/train.py --config configs/train.yaml --stage 1
#
# PRESET 3: Stage 1 with Augmentation
#   - Uncomment the 'augmentation' section with techniques above
#   - Set 'enabled: true'
#   - python scripts/train.py --config configs/train.yaml --stage 1
#
# PRESET 4: Stage 2 (requires Stage 1 checkpoint)
#   - Set 'pipeline.stage: 2'
#   - Uncomment 'stage1_checkpoint' and set path
#   - python scripts/train.py --config configs/train.yaml --stage 2
