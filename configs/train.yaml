# One-run recipe: CleanUNet2-Mamba trained end to end, waveform branch initialized from CleanUMamba-E8 (DNS).
base: base.yaml
model:
  architecture: model/cleanunet2_mamba_e8.yaml
  init:
    cleanunet_from_cleanumamba: ../cleanumamba/checkpoints/models/CleanUMamba-3N-E8-full.pkl
optim:
  lr: 1.0e-4
  lr_scale: {clean_unet: 0.3}    # pretrained waveform branch learns slower than the new modules
