# configs/train.yaml
# Refactored configuration for training CleanUNet2 with PyTorch Lightning.
# Comments are in English and keys are grouped for clarity.

# ----------------------
# Trainer configuration
# ----------------------
trainer:
  # 'auto' will use GPU if available, otherwise CPU
  accelerator: "auto"
  # Use an integer (number of devices) or "auto" depending on your environment
  devices: 1
  max_epochs: 10000
  # Optionally use max_steps instead of max_epochs
  # max_steps: 1000000
  # Numerical precision: choose "32-true" (full float32) or "16-mixed" for AMP
  precision: "16-mixed"
  # How often (in steps) Lightning logs metrics
  log_every_n_steps: 100
  # Validate every N epochs (float allowed for fraction of epoch)
  check_val_every_n_epoch: 10
  # Gradient clipping to stabilize training (None or numeric)
  gradient_clip_val: 1.0
  # Deterministic flags (helpful for reproducibility; may slow down training)
  deterministic: false
  benchmark: true

# ----------------------
# Global / runtime
# ----------------------
seed: 1234            # global seed for reproducibility
checkpoint_dir: "logs/checkpoints"  # default directory for checkpoints
logging_dir: "logs"   # base dir for loggers (TensorBoard, etc.)

# ----------------------
# Model & optimizer hyperparameters
# ----------------------
model:
  # Learning rate used by the optimizer (AdamW in the training script)
  lr: 1e-4
  # Sample rate of audio data
  sample_rate: 16000

  # Select the conditioning method here:
  # Options: "addition", "concatenation", "film"
  conditioning_type: "film"

    
  cleanunet_checkpoint: "checkpoints/cleanunet/last.ckpt"
  cleanspecnet_checkpoint: "checkpoints/cleanspecnet/last.ckpt"

  # Controle de Congelamento (True = Treinar, False = Congelar)
  train_cleanunet: true        # Mantém CleanUNet congelado
  train_cleanspecnet: true     # Mantém CleanSpecNet congelado

  # Loss configuration grouped for clarity
  loss_config:
    ell_p: 1                 # 1 -> L1, 2 -> L2
    ell_p_lambda: 1.0        # weight of the waveform reconstruction loss
    stft_lambda: 1.0         # weight for STFT-based losses inside CleanUNet2Loss
    sc_lambda: 0.5           # weight for spectral convergence inside MR-STFT
    mag_lambda: 0.5          # weight for magnitude (log-magnitude) inside MR-STFT
    # Multi-resolution STFT parameters (must be same length lists)
    stft_config:
      fft_sizes: [512, 1024, 2048]
      hop_sizes: [50, 120, 240]
      win_lengths: [240, 600, 1200]

# ----------------------
# Data configuration
# ----------------------
data:
  data_dir: "/home/fred/Projetos/DATASETS/VoiceBank-DEMAND-16k/"

  # ============================================================
  # CONFIGURAÇÃO DE ARQUIVO - Duas opções:
  # ============================================================
  # Option 1: CSV file with pairs (clean|noisy)
  # Option 2: Directory path (auto-scan for .wav files recursively)

  train_list_path: "filelists/train.csv"

  # ============================================================
  # CONFIGURAÇÃO DE VALIDAÇÃO - Escolha UMA das opções abaixo:
  # ============================================================

  # OPÇÃO 1: Usar arquivo/lista separada para validação
  val_list_path: "filelists/test.csv"

  # OPÇÃO 2: Split automático (porcentagem do conjunto de treino)
  # Comente 'val_list_path' acima e descomente a linha abaixo:
  # val_split: 0.1  # 10% do treino para validação (0.15 = 15%, 0.2 = 20%, etc.)

  batch_size: 30
  num_workers: 8
  persistent_workers: true
  # Optional: segment length (samples) used by dataset sampling (if supported). Default: 8192
  segment_size: 24576

  # ============================================================
  # Configuração de Data Augmentation
  # ============================================================
  # Três modos são suportados:
  #
  # MODE 1: "two_folders" - Você já tem pares clean/noisy
  # ---------------------------------------------------------------
  # Quando sua filelist contém pares "clean_path|noisy_path".
  # O modelo treina usando os arquivos ruidosos existentes.
  # Augmentation NÃO é aplicado (os dados já são ruidosos).
  #
  # MODE 2: "two_folders" com apply_to_noisy=true - Augmentation adicional
  # -----------------------------------------------------------------------
  # Similar ao MODE 1, mas ADICIONA augmentations ao áudio ruidoso existente.
  # Útil para aumentar a diversidade de ruídos além do que está nos arquivos.
  #
  # MODE 3: "clean_only" - Gerar dados ruidosos on-the-fly
  # -------------------------------------------------------
  # Quando você tem apenas áudio limpo, augmentation será aplicado durante treino
  # para adicionar ruído sinteticamente. O noisy_path na filelist é ignorado.
  #
  # EXEMPLO DE CONFIGURAÇÃO:
  # ------------------------

  # OPÇÃO A: Desabilitar augmentation (usar arquivos ruidosos existentes)
  augmentation:
    enabled: false
    mode: "two_folders"

  # ------- OU -------

  # OPÇÃO B: Habilitar augmentation (modo clean_only - gerar ruído de áudio limpo)
  # augmentation:
  #   enabled: true
  #   mode: "clean_only"
  #   augmentations:
  #     - name: AddBackgroundNoise
  #       params:
  #         # SUPORTA BUSCA RECURSIVA! Especifique apenas o diretório:
  #         background_paths: "/path/to/noise/folder"  # Busca .wav/.flac/.mp3/.ogg recursivamente
  #         # Ou use lista de diretórios/arquivos:
  #         # background_paths:
  #         #   - "/path/to/noise/DEMAND"
  #         #   - "/path/to/noise/FSDnoisy18k"
  #         min_snr_in_db: 0.0
  #         max_snr_in_db: 15.0
  #         p: 0.8  # Probabilidade de aplicar

  # ------- OU -------

  # OPÇÃO C: Adicionar augmentations ao áudio ruidoso existente (modo two_folders + apply_to_noisy)
  # augmentation:
  #   enabled: true
  #   mode: "two_folders"
  #   apply_to_noisy: true  # NOVO! Aplicar augmentations ao áudio ruidoso
  #   augmentations:
  #     # Adiciona ruído adicional ao áudio já ruidoso
  #     - name: AddBackgroundNoise
  #       params:
  #         background_paths: "/path/to/extra/noise"  # Busca recursiva automática!
  #         min_snr_in_db: 10.0
  #         max_snr_in_db: 30.0
  #         p: 0.5
  #
  #     # Outros augmentations opcionais:
  #     # - name: AddColoredNoise
  #     #   params:
  #     #     min_snr_in_db: 5.0
  #     #     max_snr_in_db: 20.0
  #     #     min_f_decay: -2.0
  #     #     max_f_decay: 2.0
  #     #     p: 0.5
  #     #
  #     # - name: ApplyImpulseResponse
  #     #   params:
  #     #     ir_paths: "/path/to/impulse/responses"  # Busca recursiva também!
  #     #     p: 0.3
  #     #
  #     # - name: Gain
  #     #   params:
  #     #     min_gain_in_db: -12.0
  #     #     max_gain_in_db: 12.0
  #     #     p: 0.5
  #     #
  #     # - name: LowPassFilter
  #     #   params:
  #     #     min_cutoff_freq: 2000
  #     #     max_cutoff_freq: 7500
  #     #     p: 0.3
  #     #
  #     # - name: HighPassFilter
  #     #   params:
  #     #     min_cutoff_freq: 200
  #     #     max_cutoff_freq: 1200
  #     #     p: 0.3
  #
  # NOTA: Arquivos de ruído/IR são automaticamente reamostrados para 16kHz (configurado em model.sample_rate)

# ----------------------
# Callbacks
# ----------------------
callbacks:
  # Save best checkpoint based on validation loss
  best_checkpoint:
    _target_: "pytorch_lightning.callbacks.ModelCheckpoint"
    monitor: "val/weighted_score"
    dirpath: "logs/checkpoints"
    filename: "best-model-{epoch:02d}-{val\/weighted_score:.4f}"
    save_top_k: 1
    mode: "max"
  # Periodic checkpointing (every N epochs)
  periodic_checkpoint:
    _target_: "pytorch_lightning.callbacks.ModelCheckpoint"
    dirpath: "logs/checkpoints"
    filename: "epoch-{epoch:04d}"
    every_n_epochs: 10
    save_top_k: 3
    save_last: true
    monitor: "val_loss"
    mode: "min"
    # monitor/mode not needed for simple periodic saving

  # Example early stopping (commented by default)
  # early_stopping:
  #   _target_: "pytorch_lightning.callbacks.EarlyStopping"
  #   monitor: "val_loss"
  #   patience: 20
  #   mode: "min"

# ----------------------
# Logger
# ----------------------
logger:
  _target_: "pytorch_lightning.loggers.TensorBoardLogger"
  save_dir: "logs"
  name: "cleanunet2"

logger:
  # Choose: 'tensorboard', 'wandb' or 'both' (for both)
  choice: "tensorboard"
  
  tensorboard:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: "logs"
    name: "cleanunet2"
    default_hp_metric: false

  wandb:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: "CleanUNet2_Project"
    name: "cleanunet2_run"
    save_dir: "logs"
    offline: false  # Change for true if no internet
    log_model: true

# ----------------------
# Resume / checkpoints
# ----------------------
# Set this to a checkpoint path to resume training
# resume_from_checkpoint: "logs/checkpoints/last.ckpt"

