# ============================================================================
# CleanUNet2 Training Configuration (WavLM-Only, Stage 1 & 2)
# ============================================================================
#
# Usage:
#   - Stage 1 (with embeddings): python train.py --config configs/train.yaml --stage 1
#   - Stage 2 (requires Stage 1): edit pipeline.stage and set stage1_checkpoint
#   - Quick test: python train.py --config configs/train.yaml --quick-test
#
# ============================================================================

pipeline:
  stage: 1                                  # 1 or 2
  stage1_checkpoint: null                   # Set for Stage 2

# ============================================================================
# TRAINER CONFIGURATION
# ============================================================================
trainer:
  max_epochs: 300
  val_check_interval: 1.0
  log_every_n_steps: 10
  precision: "16-mixed"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  enable_progress_bar: true
  num_sanity_val_steps: 2
  accelerator: "auto"
  devices: 1

# ============================================================================
# MODEL ARCHITECTURE
# ============================================================================
model:
  wavlm:
    model_name: "microsoft/wavlm-large"
    embedding_dim: 768
    hidden_states_layer: 24
    normalize_embeddings: true

  cleanunet:
    channels: 1
    n_fft: 1024
    hop_length: 256
    n_mels: 64
    segment_size: 32000                    # 2 seconds at 16kHz
    filter_channels: 128
    kernel_size: 5
    dilation_cycle: 4
    n_layers: 4
    use_attention: true
    dropout: 0.1

  cleanspecnet:
    n_fft: 1024
    hop_length: 256
    n_mels: 64
    n_layers: 4
    n_heads: 8
    hidden_dim: 256
    dropout: 0.1

# ============================================================================
# LOSS FUNCTIONS
# ============================================================================
loss:
  l1_weight: 0.5
  stft_weight: 0.3
  phase_weight: 0.1
  spec_weight: 0.1
  stft_config:
    fft_sizes: [1024, 2048, 512]
    hop_sizes: [160, 320, 80]
    win_lengths: [1024, 2048, 512]

# ============================================================================
# OPTIMIZER & SCHEDULER
# ============================================================================
optimizer:
  name: "AdamW"
  lr: 5.0e-05                               # Learning rate
  betas: [0.9, 0.999]
  eps: 1.0e-08
  weight_decay: 1.0e-04
  amsgrad: false

scheduler:
  enabled: false                            # Set to true for warmup + decay
  warmup_steps: 1000
  total_steps: null

# ============================================================================
# DATA CONFIGURATION
# ============================================================================
data:
  data_dir: "/path/to/VoiceBank-DEMAND-16k/"  # EDIT THIS
  train_list_path: "filelists/train.csv"
  val_list_path: "filelists/test.csv"
  val_split: null                           # Alternative: 0.1 for 10% auto-split
  batch_size: 16
  num_workers: 4
  persistent_workers: false
  segment_size: 32000                       # Audio segment length (samples)
  sampling_rate: 16000                      # Target sample rate
  use_preextracted_embeddings: false        # true for pre-extracted WavLM cache

  augmentations:
    enabled: false                          # Set to true to enable augmentation
    techniques:
      - pitch_shift
      - time_stretch
      - add_gaussian_noise
      - compress
    probability: 0.5

# ============================================================================
# CHECKPOINT SAVING
# ============================================================================
checkpoint:
  save_dir: "experiments/stage1_baseline/checkpoints"
  monitor_metric: "val_loss"
  save_top_k: 3
  save_last: true
  mode: "min"

# ============================================================================
# LOGGING
# ============================================================================
logging:
  tensorboard_dir: "experiments/stage1_baseline/tensorboard"
  wandb_enabled: false
  wandb_project: "cleanunet2_wavlm"
  wandb_entity: null                        # Set your W&B username if enabled
  log_metrics_interval: 10

# ============================================================================
# CALLBACKS
# ============================================================================
callbacks:
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: "experiments/stage1_baseline/checkpoints"
    monitor: "val_loss"
    mode: "min"
    save_top_k: 3
    save_last: true
    filename: "best-epoch-{epoch:02d}-val_loss-{val_loss:.3f}"

  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: "val_loss"
    patience: 30
    min_delta: 0.0
    mode: "min"

# ============================================================================
# LOGGER
# ============================================================================
logger:
  choice: "tensorboard"                     # "tensorboard", "wandb", or "both"

  tensorboard:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: "experiments/stage1_baseline"
    name: "tensorboard"
    version: null

  wandb:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: "cleanunet2_wavlm"
    entity: null                            # Set your W&B username
    save_dir: "experiments/stage1_baseline"
