# configs/train.yaml
# Refactored configuration for training CleanUNet2 with PyTorch Lightning.
# Comments are in English and keys are grouped for clarity.

# ----------------------
# Trainer configuration
# ----------------------
trainer:
  # 'auto' will use GPU if available, otherwise CPU
  accelerator: "auto"
  # Use an integer (number of devices) or "auto" depending on your environment
  devices: 1
  max_epochs: 1000
  # Optionally use max_steps instead of max_epochs
  # max_steps: 1000000
  # Numerical precision: choose "32-true" (full float32) or "16-mixed" for AMP
  precision: "16-mixed"
  # How often (in steps) Lightning logs metrics
  log_every_n_steps: 10
  # Validate every N epochs (float allowed for fraction of epoch)
  check_val_every_n_epoch: 1
  # Gradient clipping to stabilize training (None or numeric)
  gradient_clip_val: 5.0
  # Deterministic flags (helpful for reproducibility; may slow down training)
  deterministic: false
  benchmark: true

# ----------------------
# Global / runtime
# ----------------------
seed: 1234            # global seed for reproducibility
checkpoint_dir: "logs/checkpoints"  # default directory for checkpoints
logging_dir: "logs"   # base dir for loggers (TensorBoard, etc.)

# ----------------------
# Model & optimizer hyperparameters
# ----------------------
model:
  # Learning rate used by the optimizer (AdamW in the training script)
  lr: 5.0e-5
  # Sample rate of audio data
  sample_rate: 16000

  # Select the conditioning method here:
  # Options: "addition", "concatenation", "film"
  conditioning_type: "film"

  # Training control: freeze or unfreeze submodules
  # Set to true to train the module, false to freeze it
  #
  # Examples:
  #   - Both false (default): Only train the conditioning/glue layers (recommended for fine-tuning)
  #   - train_cleanunet: true, train_cleanspecnet: false: Train CleanUNet + glue layers
  #   - train_cleanunet: false, train_cleanspecnet: true: Train CleanSpecNet + glue layers
  #   - Both true: Full end-to-end training (requires more GPU memory)
  #
  train_cleanunet: true      # If false, CleanUNet weights are frozen
  train_cleanspecnet: true   # If false, CleanSpecNet weights are frozen

  # Checkpoint paths for pretrained submodules (optional)
  # These will be loaded before training starts
  # cleanunet_checkpoint: "path/to/cleanunet_pretrained.ckpt"
  # cleanspecnet_checkpoint: "path/to/cleanspecnet_pretrained.ckpt"

  # Loss configuration grouped for clarity
  loss_config:
      # ────────────────────────────────────────────────────────────────
      # Time domain and frequency domain loss weights
      # ────────────────────────────────────────────────────────────────
      time_domain_weight: 1.0           # Weight for time-domain losses
      stft_magnitude_weight: 1.0        # Weight for STFT magnitude component
      stft_phase_weight: 0.1            # Weight for STFT phase component
      phase_consistency_weight: 0.1     # Weight for phase consistency
      spectral_convergence_weight: 0.0  # Weight for spectral convergence

      # ────────────────────────────────────────────────────────────────
      # Waveform reconstruction loss parameters (CleanUNet2Loss)
      # ────────────────────────────────────────────────────────────────
      ell_p: 1                          # 1 -> L1 loss, 2 -> L2 loss (MSE)
      ell_p_lambda: 1.0                 # Weight of waveform reconstruction loss

      # ────────────────────────────────────────────────────────────────
      # STFT loss parameters (inside CleanUNet2Loss)
      # ────────────────────────────────────────────────────────────────
      stft_lambda: 1.0                  # Overall weight for STFT-based losses
      sc_lambda: 0.8                    # Spectral convergence weight (inside MR-STFT)
      mag_lambda: 0.2                   # Magnitude weight (log-magnitude inside MR-STFT)

      # ────────────────────────────────────────────────────────────────
      # Global loss combination weights (training & validation)
      # ────────────────────────────────────────────────────────────────
      weight_waveform: 10.0             # Waveform domain loss weight
      weight_spec: 5.0                  # Spectrogram domain loss weight
      weight_phase: 5.0                 # Phase consistency loss weight

      # ────────────────────────────────────────────────────────────────
      # Multi-resolution STFT parameters (must have same length)
      # ────────────────────────────────────────────────────────────────
      stft_config:
        fft_sizes: [512, 1024, 2048]    # FFT sizes for multi-resolution analysis
        hop_sizes: [50, 120, 240]       # Hop sizes (stride) for each resolution
        win_lengths: [240, 600, 1200]   # Window lengths for each resolution


# ----------------------
# Data configuration
# ----------------------
data:
  data_dir: "/home/ubuntu/fred-experiments/DATASETS/VoiceBank-DEMAND-16k/"
  train_list_path: "filelists/train.csv"
  val_list_path: "filelists/test.csv"
  batch_size: 16
  num_workers: 8
  persistent_workers: true
  # Optional: segment length (samples) used by dataset sampling (if supported)
  #segment_size: 16384

# ----------------------
# Callbacks
# ----------------------
callbacks:
  # Save best checkpoint based on validation loss
  best_checkpoint:
    _target_: "pytorch_lightning.callbacks.ModelCheckpoint"
    monitor: "val_loss"
    dirpath: "logs/checkpoints"
    filename: "best-model-{epoch:02d}-{val_loss:.4f}"
    save_top_k: 1
    mode: "min"
  # Periodic checkpointing (every N epochs)
  periodic_checkpoint:
    _target_: "pytorch_lightning.callbacks.ModelCheckpoint"
    dirpath: "logs/checkpoints"
    filename: "epoch-{epoch:04d}"
    every_n_epochs: 10
    save_top_k: 3
    save_last: true
    monitor: "val_loss"
    mode: "min"
    # monitor/mode not needed for simple periodic saving

  # Example early stopping (commented by default)
  # early_stopping:
  #   _target_: "pytorch_lightning.callbacks.EarlyStopping"
  #   monitor: "val_loss"
  #   patience: 20
  #   mode: "min"

# ----------------------
# Logger
# ----------------------
logger:
  # Choose: 'tensorboard', 'wandb' or 'both' (for both)
  choice: "wandb"

  tensorboard:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: "logs"
    name: "cleanunet2"
    default_hp_metric: false

  wandb:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: "CleanUNet2_Project"
    name: "cleanunet2_run"
    save_dir: "logs"
    offline: false  # Change to true if no internet
    log_model: true

# ----------------------
# Resume / checkpoints
# ----------------------
# Set this to a checkpoint path to resume training
resume_from_checkpoint: "logs/checkpoints/last.ckpt"