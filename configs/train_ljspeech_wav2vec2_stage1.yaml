# configs/train_ljspeech_wav2vec2_stage1.yaml
# Stage-1 Training Configuration: Training with WavLM Embeddings
# WavLM embeddings are PRE-EXTRACTED from clean audio and loaded from disk

# ⚠️  IMPORTANT: Run extract_wav2vec2_embeddings.py BEFORE training!
# python extract_wav2vec2_embeddings.py --config configs/train_ljspeech_wav2vec2_stage1.yaml

# ----------------------
# Trainer configuration
# ----------------------
trainer:
  accelerator: "auto"
  devices: 1
  max_epochs: 15000
  precision: "16-mixed"
  log_every_n_steps: 100
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  deterministic: false
  benchmark: true

# ----------------------
# Global / runtime
# ----------------------
seed: 1234
checkpoint_dir: "logs/wav2vec2_stage1_checkpoints"
logging_dir: "logs/wav2vec2_stage1"
latents_dir: "stored_latents_wav2vec2_stage1"  # Where to save fused latent vectors

# ----------------------
# Audio configuration
# ----------------------
audio:
  sample_rate: 22050

# ----------------------
# Model Configuration
# ----------------------
model:
  # ============================================================
  # WavLM Settings (microsoft/wavlm-base)
  # ============================================================
  use_wav2vec2: true  # Use WavLM instead of X-Vectors
  use_xvector: false  # Disable X-Vectors

  # WavLM model configuration
  wav2vec2_model: "microsoft/wavlm-base"  # Pre-trained WavLM model
  wav2vec2_cache_dir: "wav2vec2_embeddings"  # Directory with pre-extracted embeddings
  use_preextracted_embeddings: true  # Load pre-extracted embeddings (RECOMMENDED!)

  # Note: Embedding dimension is automatically determined (768 for microsoft/wavlm-base)
  conditioning_type: "film"  # Conditioning method for spec+waveform fusion

  # Optional: Load vanilla CleanUNet2 checkpoint for warm start
  vanilla_checkpoint: "/home/fred/Projetos/AKCIT/INTERSPEECH2026/checkpoints/cleanunet2_vanilla_VoiceBank-DEMAND-16k/last.ckpt"

  # CleanUNet parameters
  cleanunet_params:
    channels_input: 1
    channels_output: 1
    channels_H: 64
    max_H: 768
    encoder_n_layers: 8
    kernel_size: 4
    stride: 2
    tsfm_n_layers: 5
    tsfm_n_head: 8
    tsfm_d_model: 512
    tsfm_d_inner: 2048

  # CleanSpecNet parameters
  cleanspecnet_params:
    input_channels: 513
    num_conv_layers: 5
    kernel_size: 4
    stride: 1
    conv_hidden_dim: 64
    hidden_dim: 512
    num_attention_layers: 5
    num_heads: 8
    dropout: 0.1

# ----------------------
# Loss Configuration
# ----------------------
losses:
  weight_waveform: 10.0  # Weight for waveform reconstruction loss
  weight_spec: 1.0       # Weight for spectrogram loss
  weight_phase: 1.0      # Weight for phase loss

  # STFT loss configuration
  stft_config:
    fft_sizes: [512, 1024, 2048]
    hop_sizes: [128, 256, 512]
    win_lengths: [512, 1024, 2048]

# ----------------------
# Optimizer Configuration
# ----------------------
optimizer:
  lr: 1e-4
  betas: [0.9, 0.999]

# ----------------------
# Data configuration
# ----------------------
data:
  data_dir: "./"
  train_list_path: "filelists/ljspeech.csv"
  val_list_path: "two_folders:/home/fred/Projetos/DATASETS/VoiceBank-DEMAND-16k/test/clean,/home/fred/Projetos/DATASETS/VoiceBank-DEMAND-16k/test/noisy"
  batch_size: 4
  num_workers: 8
  persistent_workers: true
  segment_size: 32768
  sampling_rate: 22050
  use_xvector_cache: true  # Use dataset with file path tracking (REQUIRED for pre-extracted embeddings!)

  # ============================================================
  # Data Augmentation (On-the-Fly)
  # ============================================================
  augmentations:
    # 1. Ruído colorido (pink, brown, white)
    - name: "AddColoredNoise"
      params:
        min_snr_in_db: -5.0
        max_snr_in_db: 20.0
        min_f_decay: -2.0
        max_f_decay: 2.0
        p: 0.7

    # 2. Ruído de fundo
    - name: "AddBackgroundNoise"
      params:
        background_paths: "/home/fred/Projetos/DATASETS/ESC-50-master/audio/"
        min_snr_in_db: -10.0
        max_snr_in_db: 15.0
        p: 0.5

    # 3. Variação de volume
    - name: "Gain"
      params:
        min_gain_in_db: -12.0
        max_gain_in_db: 6.0
        p: 0.5

    # 4. Filtro passa-baixa
    - name: "LowPassFilter"
      params:
        min_cutoff_freq: 2000.0
        max_cutoff_freq: 8000.0
        p: 0.3

    # 5. Filtro passa-alta
    - name: "HighPassFilter"
      params:
        min_cutoff_freq: 100.0
        max_cutoff_freq: 400.0
        p: 0.3

# ----------------------
# Callbacks
# ----------------------
callbacks:
  # Save best checkpoint based on weighted score
  best_checkpoint:
    _target_: "pytorch_lightning.callbacks.ModelCheckpoint"
    monitor: "val/weighted_score"
    dirpath: "logs/wav2vec2_stage1_checkpoints"
    filename: "wav2vec2_stage1-best-{epoch:02d}-{val/weighted_score:.4f}"
    save_top_k: 1
    mode: "max"

  # Periodic checkpointing
  periodic_checkpoint:
    _target_: "pytorch_lightning.callbacks.ModelCheckpoint"
    dirpath: "logs/wav2vec2_stage1_checkpoints"
    filename: "wav2vec2_stage1-epoch-{epoch:04d}"
    every_n_epochs: 1
    save_top_k: 3
    save_last: true
    monitor: "val_loss"
    mode: "min"

# ----------------------
# Logger
# ----------------------
logger:
  choice: "both"

  tensorboard:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: "logs/wav2vec2_stage1"
    name: "wav2vec2_stage1"
    default_hp_metric: false

  wandb:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: "CleanUNet2_Wav2Vec2"
    name: "stage1_with_wav2vec2"
    save_dir: "logs/wav2vec2_stage1"
    offline: false
    log_model: true

# ----------------------
# Resume / checkpoints
# ----------------------
# resume_from_checkpoint: "logs/wav2vec2_stage1_checkpoints/last.ckpt"
