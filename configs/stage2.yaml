# Stage 2 Training Configuration: WavLM Large
# Trains WITHOUT embeddings (learning to replicate internally)
# Loads Stage 1 checkpoint for initialization
# Key: use_preextracted_embeddings: false

trainer:
  accelerator: auto
  devices: 1
  max_epochs: 300
  precision: 16-mixed
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  gradient_clip_val: 5.0
  deterministic: false
  benchmark: true

seed: 1234
checkpoint_dir: "experiments/checkpoints/stage2"
logging_dir: "experiments/stage2"

audio:
  sample_rate: 16000

model:
  conditioning_type: "film"
  freeze_cleanunet: false
  freeze_cleanspecnet: false
  use_xvector: false
  use_wavlm: true
  wavlm_model: "microsoft/wavlm-large"
  wavlm_cache_dir: "wavlm_embeddings_raw"
  wavlm_layer: 12
  use_preextracted_embeddings: false
  wavlm_pooling_method: "none"
  wavlm_attention_heads: 8
  vanilla_checkpoint: null
  cleanunet_params:
    channels_input: 1
    channels_output: 1
    channels_H: 64
    max_H: 768
    encoder_n_layers: 8
    kernel_size: 4
    stride: 2
    tsfm_n_layers: 5
    tsfm_n_head: 8
    tsfm_d_model: 512
    tsfm_d_inner: 2048
  cleanspecnet_params:
    input_channels: 513
    num_conv_layers: 5
    kernel_size: 4
    stride: 1
    conv_hidden_dim: 64
    hidden_dim: 512
    num_attention_layers: 5
    num_heads: 8
    dropout: 0.1

losses:
  weight_waveform: 10.0
  weight_spec: 5.0
  weight_phase: 5.0
  ell_p: 1
  ell_p_lambda: 1.0
  stft_lambda: 1.0
  sc_lambda: 0.8
  mag_lambda: 0.2
  stft_config:
    fft_sizes: [512, 1024, 2048]
    hop_sizes: [50, 120, 240]
    win_lengths: [240, 600, 1200]

optimizer:
  lr: 5.0e-05
  betas: [0.9, 0.999]

data:
  data_dir: "/home/fred/Projetos/DATASETS/VoiceBank-DEMAND-16k/"
  train_list_path: "filelists/train.csv"
  val_list_path: "filelists/test.csv"
  batch_size: 16
  num_workers: 4
  persistent_workers: true
  segment_size: 32000
  sampling_rate: 16000

callbacks:
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_loss
    dirpath: "./experiments/checkpoints/stage2"
    filename: cleanunet-stage2-{epoch:03d}-{val_loss:.4f}
    save_top_k: 3
    mode: min
    save_last: true
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_loss
    patience: 10
    mode: min
    min_delta: 0.0001

logger:
  choice: both
  tensorboard:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: experiments/stage2
    name: tb_logs
    default_hp_metric: false
  wandb:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: "CleanUNet2_WavLM_Large"
    name: "stage2_wavlm_no_embeddings"
    save_dir: experiments/stage2
    offline: false
    log_model: true

pipeline:
  stage: 2
  stage1_checkpoint: "./experiments/checkpoints/stage1/cleanunet-stage1-last.ckpt"
  resume_from_checkpoint: null
