# ============================================================================
# SSL BACKBONE (standardized documentation -- see CONFIG_STANDARDIZATION_REPORT.md)
# ssl_model_name: facebook/wav2vec2-xls-r-2b
# ssl_model_size: 2b
# ssl_hidden_size: 1920
# ssl_num_layers: 48
# ssl_embedding_strategy: all_layers_softmax
# selected_layers: all (0..48)
# ============================================================================
model:
  cleanunet:
    in_channels: 1
    out_channels: 1
    hidden_channels: 128
    num_layers: 20
    kernel_size: 15
    dilation_base: 2
    residual_channels: 64
    skip_channels: 128
    use_film_conditioning: true

  wav2vec2:
    model_name: "facebook/wav2vec2-xls-r-2b"
    embedding_dim: 1024
    use_preextracted: false
    cache_embeddings: true
    layer: 24
    wav2vec2_layer: 24
    device: "cuda"

  # Fusion strategy — MUST match Stage 1 so the loaded weights line up.
  fusion:
    type: "hierarchical_multiscale"    # or "legacy_pooling"
    acoustic_layers: ~
    semantic_layers: ~

  latent_predictor:
    type: "tcn"                        # "baseline" | "tcn" (Stage-2 only)
    params: ~

  conditioning_type: "film"
  freeze_cleanunet: false
  freeze_cleanspecnet: false
  use_spectral_normalization: false
  dropout_rate: 0.0
  activation: "relu"

loss:
  time_domain_weight: 1.0
  stft_magnitude_weight: 1.0
  stft_phase_weight: 0.1
  phase_consistency_weight: 0.1
  spectral_convergence_weight: 0.0
  ell_p: 1
  ell_p_lambda: 1.0
  stft_lambda: 1.0
  sc_lambda: 0.8
  mag_lambda: 0.2
  weight_waveform: 10.0
  weight_spec: 5.0
  weight_phase: 5.0

optimizer:
  type: "adamw"
  learning_rate: 5.0e-05
  weight_decay: 0.00001
  betas: [0.9, 0.999]
  eps: 0.00000001

scheduler:
  type: "cosine"
  warmup_steps: 10
  total_steps: ~
  num_cycles: 0.5

data:
  data_dir: "/raid/user_fredoliveira/DATASETS/VoiceBank-DEMAND-16k/"
  train_list_path: "filelists/train.csv"
  val_list_path: "filelists/test.csv"
  val_split: ~
  batch_size: 32
  num_workers: 8
  persistent_workers: false
  segment_size: 32000
  sampling_rate: 16000
  augmentations: ~
  use_preextracted_embeddings: false
  quick_test: false
  quick_test_samples: 30

trainer:
  max_epochs: 300
  accelerator: "auto"
  devices: 1
  precision: "16-mixed"
  gradient_clip_val: 5.0
  accumulate_grad_batches: 1
  log_every_n_steps: 10
  val_check_interval: 1.0
  num_sanity_val_steps: 0
  enable_progress_bar: true

logging:
  save_dir: "./experiments/stage2"
  log_model: false
  log_frequency: 10
  save_checkpoints: true
  checkpoint_monitor: "val_loss"
  checkpoint_mode: "min"

callbacks:
  model_checkpoint:
    _target_: "pytorch_lightning.callbacks.ModelCheckpoint"
    dirpath: "./experiments/checkpoints/stage2"
    filename: "cleanunet-stage2-{epoch:03d}-{val_loss:.4f}"
    monitor: "val_loss"
    mode: "min"
    save_top_k: 3
    save_last: true

  early_stopping:
    _target_: "pytorch_lightning.callbacks.EarlyStopping"
    monitor: "val_loss"
    mode: "min"
    patience: 10
    verbose: false

logger:
  choice: "tensorboard"
  tensorboard:
    _target_: "pytorch_lightning.loggers.TensorBoardLogger"
    save_dir: "./experiments/stage2"
    name: "stage2-without-embeddings"
    version: "v1"

pipeline:
  stage: 2
  stage1_checkpoint: "./experiments/checkpoints/stage1/cleanunet-stage1-last.ckpt"
  resume_from_checkpoint: ~
  seed: 42
  log_all_config: false
