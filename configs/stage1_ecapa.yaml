# ============================================================================
# Stage-1 Training Configuration: ECAPA-TDNN Speaker Embeddings
# Model: speechbrain/spkrec-ecapa-voxceleb (192-dim)
# ============================================================================

# ----------------------
# Trainer configuration
# ----------------------
trainer:
  accelerator: auto
  devices: 1
  max_epochs: 1000
  precision: 16-mixed
  log_every_n_steps: 50
  check_val_every_n_epoch: 5
  gradient_clip_val: 5.0
  deterministic: false
  benchmark: true

# ----------------------
# Global / runtime
# ----------------------
seed: 1234
checkpoint_dir: experiments/exp_ecapa_stage1/checkpoints
logging_dir: experiments/exp_ecapa_stage1
latents_dir: experiments/exp_ecapa_stage1/stored_latents_stage1

train_latents_dir: experiments/exp_ecapa_stage1/train_latents  # default output of generate_train_latents.py (override with --output-dir)
# ----------------------
# Audio configuration
# ----------------------
audio:
  sample_rate: 16000

# ----------------------
# Model Configuration
# ----------------------
model:
  # Speaker model selection
  speaker_model: ecapa  # Options: 'xvector' (512-dim) or 'ecapa' (192-dim)
  conditioning_type: film

  # Optional: local path to pre-downloaded model
  # speaker_model_local_path: null

  use_preextracted_embeddings: true
  embedding_cache_dir: experiments/exp_ecapa_stage1/embedding_cache

  # Optional: Load vanilla CleanUNet2 checkpoint for warm start
  vanilla_checkpoint: null

  # CleanUNet parameters
  cleanunet_params:
    channels_input: 1
    channels_output: 1
    channels_H: 64
    max_H: 768
    encoder_n_layers: 8
    kernel_size: 4
    stride: 2
    tsfm_n_layers: 5
    tsfm_n_head: 8
    tsfm_d_model: 512
    tsfm_d_inner: 2048

  # CleanSpecNet parameters
  cleanspecnet_params:
    input_channels: 513
    num_conv_layers: 5
    kernel_size: 4
    stride: 1
    conv_hidden_dim: 64
    hidden_dim: 512
    num_attention_layers: 5
    num_heads: 8
    dropout: 0.1

# ----------------------
# Loss Configuration
# ----------------------
losses:
  weight_waveform: 10.0
  weight_spec: 5.0
  weight_phase: 5.0
  ell_p: 1
  ell_p_lambda: 1.0
  stft_lambda: 0.5
  sc_lambda: 0.8
  mag_lambda: 0.2
  stft_config:
    fft_sizes: [512, 1024, 2048]
    hop_sizes: [50, 120, 240]
    win_lengths: [240, 600, 1200]

# ----------------------
# Optimizer Configuration
# ----------------------
optimizer:
  lr: 5.0e-05
  betas: [0.9, 0.999]

# ----------------------
# Data configuration
# ----------------------
data:
  data_dir: /raid/user_fredoliveira/DATASETS/VoiceBank-DEMAND-16k/
  train_list_path: filelists/train.csv
  val_list_path: filelists/test.csv
  batch_size: 32
  num_workers: 8
  persistent_workers: true
  segment_size: 32768
  sampling_rate: 16000
  use_preextracted_embeddings: true

# ----------------------
# Callbacks
# ----------------------
callbacks:
  best_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_loss
    dirpath: experiments/exp_ecapa_stage1/checkpoints
    filename: stage1-best-{epoch:02d}-{val_loss:.4f}
    save_top_k: 3
    mode: min

  periodic_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: experiments/exp_ecapa_stage1/checkpoints
    filename: stage1-epoch-{epoch:04d}
    every_n_epochs: 10
    save_top_k: 5
    save_last: true
    monitor: val_loss
    mode: min

  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val_loss
    patience: 20
    mode: min
    min_delta: 0.001

# ----------------------
# Logger
# ----------------------
logger:
  choice: both

  tensorboard:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: experiments/exp_ecapa_stage1
    name: tb_logs
    default_hp_metric: false

  wandb:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: CleanUNet2_ECAPA
    name: stage1_ecapa
    save_dir: experiments/exp_ecapa_stage1
    offline: false
    log_model: true
